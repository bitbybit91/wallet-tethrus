<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}P2P Exchange{% endblock %} - USDT-TRC20</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <span class="logo-icon">&#9878;</span>
                <span>P2P Exchange</span>
            </a>
            <nav class="nav">
                <a href="/" id="nav-home">Home</a>
                <a href="/offers" id="nav-offers">Offers</a>
                <a href="#" class="auth-required" onclick="location.href='/offers#create'">Create Offer</a>
                <a href="#" class="auth-required" id="nav-trades" onclick="Trades.showMyTrades()">My Trades</a>
            </nav>
            <div class="user-info" id="user-info" style="display:none;"></div>
            <div id="auth-actions">
                <button class="btn btn-primary btn-sm" onclick="App.createSession()">
                    Start Trading
                </button>
            </div>
        </div>
    </header>

    <div id="alert-container"></div>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>P2P Exchange &mdash; Non-custodial, No-KYC USDT-TRC20 Trading</p>
        <p>&#128274; End-to-end encrypted &bull; &#127760; Tor-friendly &bull; &#9889; No registration required</p>
    </footer>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/encryption.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
