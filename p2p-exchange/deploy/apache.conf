# Apache Virtual Host Configuration for P2P Exchange
# Serves the application on port 80 (clearnet) with reverse proxy
# to the Python WSGI backend (Gunicorn).

<VirtualHost *:80>
    ServerName p2p-exchange.example.com
    ServerAdmin admin@example.com

    # Document root for static files
    DocumentRoot /var/www/p2p-exchange/app/static

    # Reverse proxy to Gunicorn backend
    ProxyPreserveHost On
    ProxyPass /static !
    ProxyPass /socket.io ws://127.0.0.1:5000/socket.io
    ProxyPassReverse /socket.io ws://127.0.0.1:5000/socket.io
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # Static files served directly by Apache
    Alias /static /var/www/p2p-exchange/app/static
    <Directory /var/www/p2p-exchange/app/static>
        Require all granted
        Options -Indexes
        AllowOverride None

        # Cache static assets
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType image/png "access plus 1 month"
            ExpiresByType image/svg+xml "access plus 1 month"
        </IfModule>
    </Directory>

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'none'"

    # HSTS (only for clearnet, not Tor)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # WebSocket support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:5000/$1 [P,L]

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/p2p-exchange-error.log
    CustomLog ${APACHE_LOG_DIR}/p2p-exchange-access.log combined

    # Rate limiting (requires mod_ratelimit)
    <IfModule mod_ratelimit.c>
        <Location /api/>
            SetOutputFilter RATE_LIMIT
            SetEnv rate-limit 512
        </Location>
    </IfModule>
</VirtualHost>

# Required Apache modules:
# sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers expires
