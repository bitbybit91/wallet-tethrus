name: tethrus
description: "Tethrus — Privacy-first, no-KYC, non-custodial USDT-TRC20 P2P trading platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.0

  # Dependency Injection
  get_it: ^7.7.0

  # Networking
  dio: ^5.5.0+1
  web_socket_channel: ^3.0.0

  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Crypto
  bip39: ^1.0.6
  pointycastle: ^3.9.1
  convert: ^3.1.1
  hex: ^0.2.0
  crypto: ^3.0.5
  ed25519_hd_key: ^2.3.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.0
  pull_to_refresh_flutter3: ^2.0.2
  smooth_page_indicator: ^1.2.0+3
  lottie: ^3.1.2
  intl: ^0.19.0

  # Security
  local_auth: ^2.2.0
  flutter_windowmanager: ^2.1.0

  # Utilities
  uuid: ^4.4.2
  logger: ^2.4.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  clipboard: ^0.1.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.19.1

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400

  assets:
    - assets/icons/
    - assets/images/
